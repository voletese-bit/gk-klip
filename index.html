<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Greenkeeper Klip</title>
<meta name="theme-color" content="#0f1a13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GK Klip">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0b140e;--panel:#111d15;--card:#16251b;--card2:#1b2e21;--line:#ffffff14;--line2:#ffffff22;--text:#f1f4ec;--muted:#9aac9d;
  --lime:#bfe08a;--lime2:#8fbf55;--sand:#f0d28c;--ice:#93bedb;--rose:#e0998a;--accent:#bfe08a;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  --cond:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
/* baggrunden: en klippet bane i mørke – brede striber, der falder ud i mørket */
body{display:flex;flex-direction:column;background:
  radial-gradient(120% 70% at 50% -10%,#2b4a28 0%,#0b140e 62%),
  repeating-linear-gradient(115deg,#ffffff06 0 46px,#00000000 46px 92px),#0b140e;background-attachment:fixed}
header{padding:calc(14px + var(--safe-t)) 18px 12px;display:flex;align-items:center;gap:12px;background:linear-gradient(#0b140ef2,#0b140ecc);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:4}
header .mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#cfe9a0,#6f9b40);display:grid;place-items:center;box-shadow:0 4px 14px #8fbf5533}
header .mark svg{width:24px;height:24px}
header .ttl{flex:1;min-width:0}
header h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:700 18px/1 var(--cond);letter-spacing:.03em;margin:0;text-transform:uppercase}
header .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:3px}
header .wallet{white-space:nowrap;flex:none;font:700 17px/1 var(--cond);letter-spacing:.04em;color:#1a1406;background:linear-gradient(135deg,#f6dfa0,#d9b25c);padding:8px 12px;border-radius:999px;font-variant-numeric:tabular-nums;box-shadow:0 3px 12px #d9b25c33}
main{flex:1;overflow-y:auto;padding:16px 16px calc(100px + var(--safe-b))}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + var(--safe-b));display:flex;background:#101b14ee;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line2);border-radius:20px;z-index:5;padding:5px;box-shadow:0 10px 30px #000a}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:8px 0 7px;font:inherit;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;border-radius:15px}
nav button.on{color:#132010;background:linear-gradient(135deg,#cfe9a0,#93c05c)}
nav button svg{display:block;margin:0 auto 2px;width:22px;height:22px}
h2{font:700 15px/1 var(--cond);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:22px 2px 10px;display:flex;align-items:center;gap:8px}
h2::after{content:"";flex:1;height:1px;background:var(--line2)}
h2:first-child{margin-top:4px}
.card{background:linear-gradient(180deg,#1a2b20,#142219);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 6px 20px #0006}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.t{font-weight:700}
.s{color:var(--muted);font-size:13px}
.pay{font:800 20px/1 var(--cond);letter-spacing:.03em;color:var(--sand);white-space:nowrap;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:3px 7px;margin-right:6px;vertical-align:2px}
.k0{background:#36552d;color:#d8f0b0}.k1{background:#2c4a24;color:var(--lime)}.k2{background:#4a4626;color:var(--sand)}
.new{background:#e0998a;color:#2a0f08}
.btn{display:inline-block;border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:800;background:linear-gradient(135deg,#cfe9a0,#93c05c);color:#10200e;letter-spacing:.03em;box-shadow:0 4px 14px #8fbf5530}
.btn.ghost{background:#ffffff08;color:var(--text);border:1px solid var(--line2);box-shadow:none}
.btn.small{padding:8px 12px;font-size:13px}
.btn:disabled{opacity:.4;box-shadow:none}
.btn.wide{width:100%;padding:14px}
input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line2);background:#0a120d;color:var(--text);font:inherit}
.empty{color:var(--muted);text-align:center;padding:26px 10px}
.msg{position:fixed;left:16px;right:16px;bottom:calc(92px + var(--safe-b));background:#26392c;border:1px solid var(--line2);border-radius:14px;padding:13px 15px;z-index:20;display:none;font-weight:700;box-shadow:0 10px 30px #000a}
.big{font-size:30px;font-weight:300;letter-spacing:.02em}
.stat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat div{background:#ffffff07;border:1px solid var(--line);border-radius:14px;padding:11px}
.stat b{display:block;white-space:nowrap;font:700 19px/1.1 var(--cond);letter-spacing:.02em;margin-top:2px}
.code{font:800 40px/1 var(--cond);letter-spacing:.24em;color:var(--lime);text-align:center;padding:12px 0 6px}
/* forsiden */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:18px 18px 16px;margin-bottom:6px;border:1px solid #ffffff1c;
  background:linear-gradient(160deg,#00000000 30%,#0b140ee6 95%),repeating-linear-gradient(100deg,#7fae4a 0 26px,#6c9a3e 26px 52px);box-shadow:0 14px 40px #000b}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 70% at 85% 0%,#fff3c455,#0000 60%)}
.hero > *{position:relative}
.hero .hi{font:700 13px/1 var(--cond);letter-spacing:.18em;text-transform:uppercase;color:#eaf6d4cc}
.hero .nm{font:800 34px/1.02 var(--cond);letter-spacing:.01em;margin:6px 0 4px;text-shadow:0 2px 10px #0006}
.hero .line{font-size:14px;color:#eef5e3;max-width:30ch}
.rank{display:flex;align-items:center;gap:10px;margin-top:14px;background:#0b140e99;border:1px solid #ffffff1a;border-radius:14px;padding:9px 11px;backdrop-filter:blur(6px)}
.rank .badge{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:800 15px/1 var(--cond);color:#1a1406;background:linear-gradient(135deg,#f6dfa0,#d9b25c);flex:none}
.rank .bar{height:6px;border-radius:4px;background:#ffffff1c;overflow:hidden;margin-top:5px}
.rank .bar i{display:block;height:100%;background:linear-gradient(90deg,#cfe9a0,#93c05c)}
.crew{display:flex;align-items:center;gap:0;margin-top:2px}
.crew .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:800 14px/1 var(--cond);border:2px solid #0b140e;margin-left:-8px;color:#0d1a0c}
.crew .av:first-child{margin-left:0}
.crew .more{margin-left:10px;font-size:13px;color:var(--muted)}
.pulse{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pulse div{background:#ffffff07;border:1px solid var(--line);border-radius:14px;padding:10px 11px}
.pulse b{display:block;font:700 22px/1 var(--cond);letter-spacing:.02em;margin-bottom:3px}
.pulse span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.job{display:flex;gap:12px;align-items:stretch}
.job .th{width:62px;flex:none;border-radius:12px;position:relative;overflow:hidden;border:1px solid #ffffff1a}
.job .th svg{position:absolute;inset:0;width:100%;height:100%}
.job .meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.job .act{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:8px}
.dots{display:inline-flex;gap:3px;vertical-align:1px;margin-left:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:#ffffff2a}
.dots i.on{background:var(--sand)}
.train{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.train button{border:1px solid #ffffff1a;border-radius:16px;padding:0;overflow:hidden;background:#142219;color:var(--text);font:inherit;text-align:left}
.train .pic{height:70px;position:relative}
.train .pic svg{position:absolute;inset:0;width:100%;height:100%}
.train .lb{min-height:62px;padding:8px 10px 9px;font:700 15px/1 var(--cond);letter-spacing:.06em;text-transform:uppercase}
.train .lb small{display:block;font:600 11px/1.3 system-ui,sans-serif;letter-spacing:0;text-transform:none;color:var(--muted);margin-top:3px}
.mach{display:flex;gap:12px;align-items:center}
.mach .ic{width:56px;height:56px;border-radius:14px;flex:none;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#2d4a2a,#16251b);border:1px solid #ffffff1a}
.mach .ic svg{width:34px;height:34px}
.ach{display:flex;flex-wrap:wrap;gap:6px}
.ach span{font-size:12px;font-weight:700;border-radius:999px;padding:6px 10px;background:#ffffff08;border:1px solid var(--line2);color:var(--muted)}
.ach span.got{background:#2c4a24;border-color:#8fbf5566;color:#dff2bf}
/* Klippeskærmen */
#mow{position:fixed;inset:0;background:#0a120d;z-index:30;display:none;touch-action:none}
#cv,#cv3{position:absolute;inset:0;width:100%;height:100%}
#cv3{display:none}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(10px + var(--safe-t)) 12px 10px;display:flex;gap:10px;align-items:center;background:linear-gradient(#0a120dcc,#0a120d00)}
#hud .bar{flex:1;height:10px;border-radius:6px;background:#ffffff1f;overflow:hidden}
#hud .bar i{display:block;height:100%;background:var(--lime);width:0}
#hud .pct{font-weight:800;min-width:46px;text-align:right;font-variant-numeric:tabular-nums}
#deckBtn{position:absolute;right:16px;bottom:calc(22px + var(--safe-b));width:96px;height:96px;border-radius:50%;border:2px solid #ffffff55;background:#0a120dcc;color:#eef2ea;font:inherit;font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 4px 18px #000a;touch-action:none}
#deckBtn svg{width:34px;height:34px}
#deckBtn.on{background:radial-gradient(circle at 35% 30%,#d4ea9c,#8fb35a);color:#10200e;border-color:#e6f5c4}
#mowbtns{position:absolute;right:12px;bottom:calc(132px + var(--safe-b));display:flex;flex-direction:column;gap:8px;align-items:flex-end}
#mowbtns .btn{box-shadow:0 2px 10px #0008}
#zoom{display:flex;gap:6px}
#zoom .btn{width:44px;padding:9px 0;text-align:center}
#stick{position:absolute;left:22px;bottom:calc(26px + var(--safe-b));width:150px;height:150px;border-radius:50%;background:#ffffff14;border:1px solid #ffffff2a}
#knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:#eef2eacc}
#mowinfo{position:absolute;left:12px;right:12px;top:calc(46px + var(--safe-t));font-size:12px;color:#dfe8da;text-shadow:0 1px 3px #000}
#lineq{position:absolute;left:12px;top:calc(84px + var(--safe-t));font-size:13px;font-weight:700;color:#f3efd8;text-shadow:0 1px 3px #000}
#mini{position:absolute;right:12px;top:calc(64px + var(--safe-t));border:1px solid #ffffff40;border-radius:6px;background:#0008;image-rendering:pixelated}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}
</style>
</head>
<body>
<header><div class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M3 18 9 4h3L6 18zM9 18l6-14h3l-6 14z" fill="#10200e" opacity=".85"/><circle cx="18.5" cy="17" r="2.2" fill="#fff"/></svg></div>
  <div class="ttl"><h1>Greenkeeper Klip</h1><div class="sub">Det internationale hold</div></div><span class="wallet" id="wallet">–</span></header>
<main id="main"></main>
<nav id="nav">
  <button data-tab="wall" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h10M7 17h6"/></svg>Væggen</button>
  <button data-tab="garage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20V9l9-5 9 5v11"/><path d="M7 20v-6h10v6"/></svg>Garage</button>
  <button data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Mig</button>
</nav>
<div class="msg" id="msg"></div>

<div id="mow">
  <canvas id="cv"></canvas>
  <canvas id="cv3"></canvas>
  <div id="hud"><button class="btn small ghost" id="mowBack" style="background:#0a120d99">‹</button><div class="bar"><i id="bar"></i></div><span class="pct" id="pct">0 %</span></div>
  <div id="mowinfo"></div>
  <div id="lineq"></div>
  <canvas id="mini"></canvas>
  <div id="stick"><div id="knob"></div></div>
  <div id="mowbtns">
    <button class="btn ghost small" id="hBtn" style="background:#0a120d99;display:none">Højder: lidt</button>
    <button class="btn ghost small" id="camBtn" style="background:#0a120d99">Kamera</button>
    <div id="zoom"><button class="btn ghost" id="zOut" style="background:#0a120d99">−</button><button class="btn ghost" id="zIn" style="background:#0a120d99">+</button></div>
    <button class="btn" id="mowDone">Aflever</button>
  </div>
  <button id="deckBtn" class="deck on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 15h16M6 15v3M18 15v3M9 15V9h6v6"/><path id="deckArrow" d="M12 3v4M9.5 5.5 12 3l2.5 2.5"/></svg><span id="deckTxt">Klipper</span></button>
</div>

<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "./lib/GLTFLoader.js";
import * as SkeletonUtils from "./lib/SkeletonUtils.js";
window.THREE = THREE; window.GLTFLoader = GLTFLoader; window.SkeletonUtils = SkeletonUtils;
</script>
<script>
"use strict";
const API = "https://wvrtaeefmjgyvxmumrgc.supabase.co/functions/v1/gk-api";
const KIND = ["Greens", "Fairways", "Rough"];
// Klipperne: bredde (m) og fart (m/s). Låneklipperen fra klubben er smallere og langsommere.
const OWN = { 0: { w: 0.56, v: 1.7 }, 1: { w: 2.5, v: 3.3 }, 2: { w: 3.4, v: 3.6 } };
const LOAN = { 0: { w: 0.46, v: 1.15 }, 1: { w: 1.8, v: 2.2 }, 2: { w: 2.2, v: 2.4 } };
const ZOOM = { 0: 34, 1: 15, 2: 11 };   // pixels pr. meter

// ---------- lager (pr. telefon) ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem("gk_" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("gk_" + k, JSON.stringify(v)); } catch {} },
};
function rnd(n) { const a = new Uint8Array(n); crypto.getRandomValues(a); return Array.from(a, (x) => x.toString(16).padStart(2, "0")).join(""); }
let id = store.get("id", null);
if (!id) { const h = rnd(16); id = { device: `${h.slice(0, 8)}-${h.slice(8, 12)}-4${h.slice(13, 16)}-a${h.slice(17, 20)}-${h.slice(20, 32)}`, secret: rnd(32), name: "" }; store.set("id", id); }

async function api(action, body = {}) {
  const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action, device: id.device, secret: id.secret, app: true, ...body }) });
  let j; try { j = await r.json(); } catch { throw new Error("Serveren svarede ikke"); }
  if (j.error) throw new Error(j.error);
  return j;
}
const kr = (v) => Math.round(v).toLocaleString("da-DK") + " kr";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let msgT = 0;
function say(t) { const m = document.getElementById("msg"); m.textContent = t; m.style.display = "block"; clearTimeout(msgT); msgT = setTimeout(() => (m.style.display = "none"), 3800); }

let me = null;
async function loadMe() {
  try { me = await api("me"); document.getElementById("wallet").textContent = kr(me.wallet); } catch (e) { say(e.message); }
  return me;
}

// ---------- faner ----------
const main = document.getElementById("main");
let tab = "wall";
document.querySelectorAll("nav button").forEach((b) => b.onclick = () => { tab = b.dataset.tab; document.querySelectorAll("nav button").forEach((x) => x.classList.toggle("on", x === b)); render(); });
function render() { ({ wall: renderWall, garage: renderGarage, me: renderMe })[tab](); }

// ---------- forsiden: morgenmødet, holdet og væggen ----------
const RANKS = [[0, "Lærling"], [3, "Klipper"], [10, "Greenkeeper"], [25, "Førstemand"], [50, "Head greenkeeper"], [100, "Banemester"]];
function rankOf(n) { let k = 0; for (let i = 0; i < RANKS.length; i++) if (n >= RANKS[i][0]) k = i; return { k, name: RANKS[k][1], next: RANKS[k + 1] || null, from: RANKS[k][0] }; }
const AVC = ["#cfe9a0", "#f0d28c", "#93bedb", "#e0b0a0", "#b8d9a8", "#d8c4f0"];
function initials(n) { return String(n || "?").trim().split(/\s+/).map((w) => w[0]).join("").slice(0, 2).toUpperCase(); }
// Et lille billede af opgaven: striber i opgavens farver (greens lyse og smalle, rough mørke og brede)
function stripeArt(kind, seed) {
  const c = [["#9fcf6a", "#7fb04e"], ["#86bd57", "#6a9c40"], ["#5f8a3d", "#4c7532"]][kind] || ["#86bd57", "#6a9c40"];
  const w = [5, 8, 12][kind] || 8, a = 20 + (seed % 50);
  let r = ""; for (let x = -60; x < 120; x += w * 2) r += `<rect x="${x}" y="-40" width="${w}" height="160" fill="${c[1]}"/>`;
  const sand = kind === 2 ? "" : `<ellipse cx="${36 + (seed % 14)}" cy="${48 - (seed % 9)}" rx="9" ry="5" fill="#e8d6a2" stroke="#00000033"/>`;
  const flag = kind === 0 ? `<line x1="22" y1="40" x2="22" y2="18" stroke="#fff" stroke-width="1.4"/><path d="M22 18h9l-3 3 3 3h-9z" fill="#e05a43"/><circle cx="22" cy="40" r="2.4" fill="#0b140e"/>` : "";
  return `<svg viewBox="0 0 62 62" preserveAspectRatio="xMidYMid slice"><rect width="62" height="62" fill="${c[0]}"/><g transform="rotate(${a} 31 31)">${r}</g>${sand}${flag}<rect width="62" height="62" fill="url(#vg)"/><defs><radialGradient id="vg" cx="30%" cy="20%" r="90%"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></radialGradient></defs></svg>`;
}
function dots(n) { return `<span class="dots">${[1, 2, 3].map((k) => `<i class="${k <= n ? "on" : ""}"></i>`).join("")}</span>`; }
function greet() { const h = new Date().getHours(); return h < 5 ? "Godnat" : h < 10 ? "God morgen" : h < 13 ? "God formiddag" : h < 18 ? "God eftermiddag" : "God aften"; }

async function renderWall() {
  main.innerHTML = `<div class="empty">Henter væggen …</div>`;
  let wall = [], top = [];
  try { [wall, , top] = await Promise.all([api("job_wall").then((j) => j.jobs), loadMe(), api("top").then((j) => j.top || []).catch(() => [])]); } catch (e) { main.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  const open = wall.filter((j) => !j.mine);
  const clubs = new Set(open.map((j) => j.poster_name)).size;
  const done = me ? me.jobs_done : 0, rk = rankOf(done);
  const pct = rk.next ? Math.round((done - rk.from) / (rk.next[0] - rk.from) * 100) : 100;
  const crew = top.slice(0, 6);
  let h = `<div class="hero">
    <div class="hi">${greet()}</div>
    <div class="nm">${esc(id.name || "Greenkeeper")}</div>
    <div class="line">${open.length ? `${open.length} ${open.length === 1 ? "bane venter" : "baner venter"} på holdet i dag${clubs > 1 ? ` – fra ${clubs} klubber` : ""}. Tag en, klip den flot, og hold banerne skarpe.` : "Væggen er tom lige nu – holdet har klippet det hele. Varm op på træningsbanen."}</div>
    <div class="rank"><div class="badge">${rk.k + 1}</div><div class="grow"><div class="t">${rk.name}</div>

// ---------- klippekortet ----------
// Hoved (32 bytes): "GKJ1", bredde, højde, cellestørrelse (m), hjørnet (cm), slags, zone, hul, klippehøjde, m² at klippe.
// Celler: zone (bit 0–2), skal klippes (bit 3), spærret (bit 4).
function parseMap(bytes) {
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  if (String.fromCharCode(...bytes.subarray(0, 4)) !== "GKJ1") throw new Error("Klippekortet kan ikke læses");
  const W = dv.getUint16(4, true), H = dv.getUint16(6, true);
  const map = { header: bytes.slice(0, 32), W, H, cell: dv.getFloat32(8, true), kind: bytes[20], zone: bytes[21], hoc: dv.getFloat32(24, true), need: dv.getFloat32(28, true), cells: bytes.slice(32, 32 + W * H) };
  // Nyere kort fra spillet: terrænets højde, græssets højde og banens gamle striber pr. celle ("GKH1")
  const N = W * H, o = 32 + N;
  if (bytes.length >= o + 8 + N * 6 && String.fromCharCode(...bytes.subarray(o, o + 4)) === "GKH1") {
    const hgt = new Float32Array(N), gmm = new Float32Array(N);
    for (let i = 0; i < N; i++) { hgt[i] = dv.getInt16(o + 8 + i * 2, true) / 100; gmm[i] = dv.getUint16(o + 8 + N * 2 + i * 2, true) / 10; }
    map.ext = { hgt, gmm, lean: bytes.slice(o + 8 + N * 4, o + 8 + N * 5), leanS: bytes.slice(o + 8 + N * 5, o + 8 + N * 6) };
  }
  return map;
}
function b64ToBytes(s) { const b = atob(s); const o = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) o[i] = b.charCodeAt(i); return o; }
function bytesToB64(b) { let s = ""; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode(...b.subarray(i, i + 0x8000)); return btoa(s); }

// Klubbens øvebane: et lille hul lavet her på telefonen
function practiceMap(kind) {
  const cell = 0.5, W = kind === 0 ? 90 : 240, H = kind === 0 ? 70 : 100;
  const zoneT = kind === 0 ? 3 : kind === 1 ? 2 : 0;
  const cells = new Uint8Array(W * H);
  const seed = Math.random() * 1000;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const X = x * cell, Y = y * cell;
    let z = 0, block = false;
    if (kind === 0) {
      const dx = (X - W * cell / 2) / 15, dy = (Y - H * cell / 2) / 11 + 0.08 * Math.sin(X / 4 + seed);
      const r = Math.hypot(dx, dy);
      z = r < 1 ? 3 : r < 1.18 ? 1 : 0;
      const bx = (X - W * cell / 2 - 17) / 4.5, by = (Y - H * cell / 2 + 6) / 3;
      if (Math.hypot(bx, by) < 1) block = true;
    } else if (kind === 1) {
      const c = H * cell / 2 + 7 * Math.sin(X / 26 + seed);
      const d = Math.abs(Y - c);
      z = d < 15 ? 2 : d < 18 ? 1 : 0;
      if (Math.hypot((X - 70) / 6, (Y - c - 13) / 3.5) < 1) block = true;
    } else {
      const c = H * cell / 2 + 6 * Math.sin(X / 30 + seed);
      const d = Math.abs(Y - c);
      z = d < 12 ? 2 : d < 15 ? 1 : 0;
      if (X < 6 || X > W * cell - 6 || Y < 3 || Y > H * cell - 3) z = 2;
    }
    let v = z & 7;
    if (block) v |= 16; else if (z === zoneT) v |= 8;
    cells[y * W + x] = v;
  }
  let need = 0; for (const v of cells) if (v & 8) need += cell * cell;
  const header = new Uint8Array(32);
  header.set([71, 75, 74, 49]);
  const dv = new DataView(header.buffer);
  const hoc = kind === 0 ? 4 : kind === 1 ? 13 : 45;
  dv.setUint16(4, W, true); dv.setUint16(6, H, true); dv.setFloat32(8, cell, true); header[20] = kind; header[21] = zoneT; dv.setFloat32(24, hoc, true); dv.setFloat32(28, need, true);
  return { header, W, H, cell, kind, zone: zoneT, hoc, need, cells, seed };
}

// ---------- klipningen ----------
const mowEl = document.getElementById("mow"), cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const mini = document.getElementById("mini"), mctx = mini.getContext("2d");
let M = null;   // den igangværende klipning

// Græssets farver: zone → (uklippet, klippet lys, klippet mørk)
const ZC = {
  0: [[64, 92, 44], [64, 92, 44], [64, 92, 44]],          // rough
  1: [[74, 112, 52], [86, 128, 60], [76, 114, 52]],       // forkrave/semirough
  2: [[70, 118, 52], [112, 166, 78], [84, 138, 60]],      // fairway
  3: [[66, 124, 58], [118, 176, 90], [88, 148, 70]],      // green
  4: [[72, 120, 54], [104, 158, 74], [84, 136, 60]],      // teested
  5: [[70, 118, 52], [112, 166, 78], [84, 138, 60]],
  6: [[64, 92, 44], [64, 92, 44], [64, 92, 44]],
  7: [[138, 132, 120], [138, 132, 120], [138, 132, 120]],
};
function cellColor(v, cutAng) {
  if (v & 16) return [214, 196, 150];   // bunker, bed, sti eller vand
  const z = v & 7, c = ZC[z];
  if (cutAng === 255) {
    if (v & 8) return [c[0][0] - 12, c[0][1] - 18, c[0][2] - 10];   // langt græs, der skal klippes
    return z === 0 || z === 6 ? c[0] : c[2];                          // allerede klippet (eller rough)
  }
  const a = cutAng / 256 * Math.PI * 2;
  const k = 0.5 + 0.5 * Math.cos(a - Math.PI / 4);
  return [0, 1, 2].map((i) => Math.round(c[2][i] + (c[1][i] - c[2][i]) * k));
}

function startMowing(map, job, practice) {
  const kind = map.kind;
  const mw = practice ? { own: false, id: "laan", name: "Klubbens låneklipper", ...LOAN[kind] } : mowerFor(kind);
  const N = map.W * map.H;
  const off = document.createElement("canvas"); off.width = map.W; off.height = map.H;
  const octx = off.getContext("2d"); const img = octx.createImageData(map.W, map.H);
  const cut = new Uint8Array(N).fill(255);
  const off3 = document.createElement("canvas"); off3.width = map.W; off3.height = map.H;
  const o3ctx = off3.getContext("2d"), img3 = o3ctx.createImageData(map.W, map.H);
  let needN = 0; for (let i = 0; i < N; i++) if (map.cells[i] & 8) needN++;
  // Start: kanten af det, der skal klippes, nærmest midten af kortet til venstre
  let sx = map.W * map.cell / 2, sy = map.H * map.cell / 2, best = 1e9;
  for (let i = 0; i < N; i += 7) if (map.cells[i] & 8) {
    const x = (i % map.W + 0.5) * map.cell, y = (Math.floor(i / map.W) + 0.5) * map.cell;
    const d = x * 0.6 + Math.abs(y - sy);
    if (d < best) { best = d; sx = x - 3; sy = y; }
  }
  M = { terr: map.ext || synthTerrain(map, practice), map, job, practice, mw, off, octx, img, off3, o3ctx, img3, cut, needN, cutN: 0, x: Math.max(1, sx), y: sy, h: 0, v: 0, pts: [], zoom: ZOOM[kind] * (window.devicePixelRatio || 1) / 1.6, dirty: true, saveAt: 0 };
  // Fortsæt, hvor du slap (samme opgave på denne telefon)
  const prog = practice ? null : store.get("prog_" + job.id, null);
  if (prog && prog.cut) {
    const c = b64ToBytes(prog.cut);
    if (c.length === N) { M.cut = c; for (let i = 0; i < N; i++) if (c[i] !== 255 && (map.cells[i] & 8)) M.cutN++; }
    M.pts = prog.pts || []; M.x = prog.x ?? M.x; M.y = prog.y ?? M.y; M.h = prog.h ?? 0;
  }
  for (let i = 0; i < N; i++) setPix(i);
  octx.putImageData(img, 0, 0); o3ctx.putImageData(img3, 0, 0);
  mini.width = map.W; mini.height = map.H;
  const mw2 = Math.min(140, window.innerWidth * 0.36); mini.style.width = mw2 + "px"; mini.style.height = (mw2 * map.H / map.W) + "px";
  document.getElementById("mowinfo").textContent = `${job.title} · ${mw.name} (${mw.w} m) · ${practice ? "øvebane" : kr(job.pay) + (mw.own ? "" : " – klubben tager 30 %")}`;
  mowEl.style.display = "block";
  document.getElementById("lineq").textContent = "";
  setDeck(true);
  if (init3()) { build3(); buildTop(); clipInitTop(); }
  applyCam();
  resize(); last = performance.now(); requestAnimationFrame(frame);
}
function setPix(i) {
  const v = M.map.cells[i], a = M.cut[i];
  const c = cellColor(v, a);
  const d = M.img.data; d[i * 4] = c[0]; d[i * 4 + 1] = c[1]; d[i * 4 + 2] = c[2]; d[i * 4 + 3] = 255;
  // 3D: det klippede græs får sin farve uden striber – striberne laves af kameraets retning i forhold til klipperetningen
  const c3 = cellColor(v, 255);   // altid uklippet – klippesporet lægges ovenpå i 3D
  const e = M.img3.data; e[i * 4] = c3[0]; e[i * 4 + 1] = c3[1]; e[i * 4 + 2] = c3[2]; e[i * 4 + 3] = 255;
}
function blocked(x, y) {
  const m = M.map, cx = Math.floor(x / m.cell), cy = Math.floor(y / m.cell);
  if (cx < 0 || cy < 0 || cx >= m.W || cy >= m.H) return true;
  return (m.cells[cy * m.W + cx] & 16) !== 0;
}
// Klip strimlen fra (x0,y0) til (x1,y1) – kun celler i opgavens zone, der skal klippes
// ---------- Lige striber: hvor lige kører du, og hvor går næste stribe? ----------
// Et træk starter, når du klipper, og slutter, når du drejer mere end 25°. Er trækket over 6 m, vises en hjælpelinje
// for det næste træk (én klippebredde ved siden af, på den side du vender) – den kan følges, men man skal selv ramme den.
function runTrack(x0, y0, x1, y1, cutting) {
  const R = M.run;
  if (!cutting) { if (R && Math.hypot(x1 - R.x, y1 - R.y) > 3) endRun(); return; }
  if (!R) { M.run = { x: x0, y: y0, h: M.h, dev: 0, n: 0, x1, y1 }; return; }
  let d = M.h - R.h; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;

function saveProg() {

let last = 0;
function frame(t) {
  if (!M) return;
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (G3) G3.dtLast = dt;
  // Ønsket retning og fart fra styrepinden (eller tastaturet)
  let jx = joy.x, jy = joy.y;
  const kx = (keys["arrowright"] || keys["d"] ? 1 : 0) - (keys["arrowleft"] || keys["a"] ? 1 : 0);
  const ky = (keys["arrowdown"] || keys["s"] ? 1 : 0) - (keys["arrowup"] || keys["w"] ? 1 : 0);
  if (kx || ky) { const l = Math.hypot(kx, ky); jx = kx / l; jy = ky / l; }
  const mag = Math.min(1, Math.hypot(jx, jy));
  let want = 0;
  if (use3D()) {
    // Bag maskinen eller fra sædet: pinden frem/tilbage er farten, til siden drejer maskinen (W/S og A/D på tastaturet)
    let fw = -joy.y, tr = joy.x;
    const kf = (keys["arrowup"] || keys["w"] ? 1 : 0) - (keys["arrowdown"] || keys["s"] ? 1 : 0);
    const kt = (keys["arrowright"] || keys["d"] ? 1 : 0) - (keys["arrowleft"] || keys["a"] ? 1 : 0);
    if (kf || kt) { fw = kf; tr = kt; }
    if (Math.abs(fw) < 0.12) fw = 0; if (Math.abs(tr) < 0.1) tr = 0;
    M.h += tr * 0.95 * dt * (fw < 0 ? -1 : 1);
    want = fw > 0 ? M.mw.v * fw : M.mw.v * 0.45 * fw;
  } else if (mag > 0.12) {
    const target = Math.atan2(jy, jx);
    let d = target - M.h; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2;
    const turn = 1.45 * dt;   // rad/s – roligere, som i spillet (Dennis 22.11.2026)
    M.h += Math.max(-turn, Math.min(turn, d));
    want = M.mw.v * mag * Math.max(0.25, Math.cos(d));   // sænk farten i skarpe sving
  }
  // Op ad bakke går det langsommere, ned ad lidt hurtigere
  { const tr = terrainAt(M.x, M.y), gr = tr.gx * Math.cos(M.h) + tr.gy * Math.sin(M.h); want *= Math.max(0.55, Math.min(1.2, 1 - gr * 2.2 * Math.sign(want || 1))); }
  if (!M.deck && M.pendRun) { let d = M.h - M.pendRun.h; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; if (Math.abs(d) > 0.9) { M.run = M.pendRun; M.pendRun = null; endRun(d); } }
  if (!M.deck) want *= 1.3;                      // med klippeenhederne oppe kører den lidt hurtigere
  M.v += (want - M.v) * Math.min(1, dt * 3);
  if (Math.abs(M.v) > 0.02) {
    const nx = M.x + Math.cos(M.h) * M.v * dt, ny = M.y + Math.sin(M.h) * M.v * dt;
    if (!blocked(nx, ny)) {
      if (M.deck) {
        const cut0 = M.cutN;
        stamp(M.x, M.y, nx, ny);
        runTrack(M.x, M.y, nx, ny, M.v > 0.05 && M.cutN >= cut0);
        maskSeg(M.x, M.y, nx, ny);
      }
      M.x = nx; M.y = ny;
      const lp = M.pts.length ? M.pts[M.pts.length - 1] : null;
      if (M.deck && (!lp || lp === null || Math.hypot(nx - lp[0], ny - lp[1]) > 0.35)) M.pts.push([+nx.toFixed(2), +ny.toFixed(2)]);
    } else { M.v = 0; if (M.pts.length && M.pts[M.pts.length - 1] !== null) M.pts.push(null); }
  }
  if (M.cutFrame) { if (useTop()) clipSpawnTop(M.cutFrame); else clipSpawn(M.cutFrame, dt); M.cutFrame = 0; }
  if (t > M.saveAt) { M.saveAt = t + 5000; saveProg(); }
  draw();
  requestAnimationFrame(frame);
}

function draw() {
  const m = M.map;
  if (M.dirty) {
    M.octx.putImageData(M.img, 0, 0); M.dirty = false;
  }
  if (useTop()) drawTop(); else if (use3D()) draw3(); else draw2();
  // Fremdrift
  const p = M.needN ? M.cutN / M.needN : 0;
  document.getElementById("bar").style.width = (p * 100).toFixed(1) + "%";
  document.getElementById("pct").textContent = Math.floor(p * 100) + " %";
  // Det lille kort
  mctx.drawImage(M.off, 0, 0);
  mctx.fillStyle = "#ff4a3a"; mctx.fillRect(M.x / m.cell - 2, M.y / m.cell - 2, 5, 5);
}
function draw2() {
  const W = cv.width, H = cv.height, z = M.zoom, m = M.map;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#1d2b1c"; ctx.fillRect(0, 0, W, H);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
  ctx.setTransform(z, 0, 0, z, W / 2 - M.x * z, H / 2 - M.y * z);
  ctx.drawImage(M.off, 0, 0, m.W * m.cell, m.H * m.cell);

  ctx.fillStyle = "#c33a2b"; ctx.fillRect(-len, -w * 0.32, len * 0.8, w * 0.64);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

// ---------- Klippesporet: en glat maske i høj opløsning ----------
// Hver klippet strækning tegnes som en blød streg (klippebredden) – farven er klipperetningen, så striberne
// kan beregnes efter, hvor kameraet kigger fra. Opgavens felter (0,5 m) bruges kun til at tælle procenterne.
function maskInit() {
  const m = M.map, Wm = m.W * m.cell, Hm = m.H * m.cell;
  const ppm = Math.max(3, Math.min(9, Math.sqrt(3.2e6 / (Wm * Hm))));
  const c = document.createElement("canvas"); c.width = Math.round(Wm * ppm); c.height = Math.round(Hm * ppm);
  const g = c.getContext("2d");
  g.lineCap = "round"; g.lineJoin = "round";
  M.mask = c; M.mg = g; M.ppm = ppm; M.maskDirty = true; M.maskAt = 0;
  // Fortsat klipning: tegn det kørte spor igen
  let p = null;
  for (const q of M.pts) { if (q && p) maskSeg(p[0], p[1], q[0], q[1]); p = q; }
}
function maskSeg(x0, y0, x1, y1) {
  if (!M.mg) return;
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy);
  if (L < 1e-4) return;
  const r = Math.round(128 + 127 * dx / L), gg = Math.round(128 + 127 * dy / L);
  const g = M.mg, k = M.ppm;
  g.strokeStyle = `rgb(${r},${gg},255)`;
  g.lineWidth = M.mw.w * k;
  g.beginPath(); g.moveTo(x0 * k, y0 * k); g.lineTo(x1 * k, y1 * k); g.stroke();
  M.maskDirty = true;
}

const NOISE_GLSL = `
float h(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float n(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(h(i), h(i + vec2(1.0, 0.0)), f.x), mix(h(i + vec2(0.0, 1.0)), h(i + vec2(1.0, 1.0)), f.x), f.y); }
vec2 warp(vec2 p) { return vec2(n(p * 0.31) + 0.5 * n(p * 0.9), n(p * 0.31 + vec2(17.3, 9.1)) + 0.5 * n(p * 0.9 + 4.7)) - 0.75; }

uniform sampler2D baseT, cellT, maskT; uniform vec2 WH; uniform float tz;
void site(vec2 wp, out vec3 col, out float zone, out float cut, out vec2 dir, out float blocked) {
  col = vec3(0.235, 0.345, 0.165); zone = 0.0; cut = 0.0; dir = vec2(1.0, 0.0); blocked = 0.0;
  vec2 uq = (wp + warp(wp) * 1.2) / WH;          // kanterne mellem zonerne bølger som på en rigtig bane
  if (uq.x <= 0.0 || uq.x >= 1.0 || uq.y <= 0.0 || uq.y >= 1.0) return;
  col = texture2D(baseT, vec2(uq.x, 1.0 - uq.y)).rgb;

    cut = mk.a;
    if (cut > 0.01) dir = normalize(mk.rg * 2.0 - 1.0 + vec2(1e-4));

const GROUND_VS = `
varying vec3 vW;
void main() { vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`;
const GROUND_FS = NOISE_GLSL + `
uniform vec3 fogC, cutC; uniform float fogN, fogF;
varying vec3 vW;
void main() {
  vec2 wp = vW.xz;
  vec3 c; float zone, cut, blocked; vec2 dir;
  site(wp, c, zone, cut, dir, blocked);
  float d = length(vW - cameraPosition);
  vec2 vv = normalize(wp - cameraPosition.xz + vec2(1e-4));
  // Klippet græs ligger i klipperetningen: lyst, når man kigger samme vej, mørkt imod
  vec3 cc = cutC * (1.0 + 0.28 * dot(dir, vv));
  float shag = 0.84 + 0.3 * n(wp * 3.3);
  c = mix(blocked > 0.5 ? c : c * shag, cc, cut);
  float fine = n(wp * 11.0) * 0.55 + n(wp * 31.0) * 0.45;
  c *= mix(0.82 + 0.3 * fine, 1.0, smoothstep(6.0, 40.0, d));
  float big = n(wp * 0.07) * 0.6 + n(wp * 0.21) * 0.4;
  c *= 0.9 + 0.2 * big;
  c = mix(c, fogC, smoothstep(fogN, fogF, d));
  gl_FragColor = vec4(c, 1.0);
}`;

// Græsstrå tæt på kameraet: langt og pjusket, hvor der ikke er klippet; kort og lagt ned i klipperetningen bagefter
const BLADE_VS = NOISE_GLSL + `
attribute vec2 io;
uniform vec2 camXZ; uniform float R, time;
varying vec3 vC; varying float vF;
float hs(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
void main() {
  vec2 wp = camXZ + mod(io - camXZ + R, 2.0 * R) - R;
  float r1 = hs(wp), r2 = hs(wp + 7.13), r3 = hs(wp + 3.71);
  wp += (vec2(r1, r2) - 0.5) * 0.12;
  vec3 col; float zone, cut, blocked; vec2 dir;
  site(wp, col, zone, cut, dir, blocked);
  float tall = (zone < 0.5 || zone > 5.5) ? 0.17 : (zone > 2.5 ? 0.075 : 0.12);
  float hgt = mix(tall, zone > 2.5 ? 0.028 : 0.05, cut);

uniform vec3 fogC; varying vec3 vC; varying float vF;
void main() { gl_FragColor = vec4(mix(vC, fogC, vF), 1.0); }`;

// Reserve-klipper (vises, indtil spillets model er hentet – eller hvis den ikke kan hentes)
function boxMower(kind, w) {
  const g = new THREE.Group();
  const org = new THREE.MeshLambertMaterial({ color: 0xd9741b }), gra = new THREE.MeshLambertMaterial({ color: 0x2c3033 });
  const box = (sx, sy, sz, m, x, y, z) => { const b = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), m); b.position.set(x, y, z); g.add(b); };
  if (kind === 0) { box(0.34, 0.22, w, gra, 0, 0.16, 0); box(0.5, 0.3, 0.45, org, -0.4, 0.32, 0); return g; }
  box(0.4, 0.26, w, org, 0, 0.2, 0); box(2.0, 0.6, 1.3, org, -1.1, 0.75, 0); box(0.07, 1.3, 1.2, gra, -1.4, 1.6, 0);
  return g;
}

// Blød skygge under maskinen
function blobShadow(len, wid) {
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const g = c.getContext("2d"), gr = g.createRadialGradient(32, 32, 4, 32, 32, 32);
  gr.addColorStop(0, "rgba(0,0,0,0.55)"); gr.addColorStop(0.6, "rgba(0,0,0,0.3)"); gr.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(len, wid), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false, fog: false }));
  m.rotation.x = -Math.PI / 2; m.position.y = 0.02; m.renderOrder = 1;
  return m;
}

// Spillets maskine: hentes én gang pr. slags. Hjul og klippecylindre drejer, mens man kører
function loadMower(kind) {
  const G = G3;
  if (!window.GLTFLoader || !MODEL[kind]) return;
  const use = (src) => {
    if (!G.mower || G.mowerKind !== kind) return;
    const inst = window.SkeletonUtils ? window.SkeletonUtils.clone(src) : src.clone(true);   // skelettet skal med i kopien
    // Først i filens egne akser (frem = +Z, på tværs = X): find hjul og cylindre og deres aksler
    inst.updateMatrixWorld(true);
    const spin = [];
    let rz = 0, rn = 0;
    const tmp = new THREE.Vector3(), pq = new THREE.Quaternion();
    inst.traverse((o) => {
      if (o.isMesh) o.frustumCulled = false;
      if (o.isBone && /^(wheel_|reel_)/.test(o.name)) {
        o.getWorldPosition(tmp);
        const reel = o.name.startsWith("reel_");
        if (reel) { rz += tmp.z; rn++; }
        o.parent.getWorldQuaternion(pq);
        const axis = new THREE.Vector3(1, 0, 0).applyQuaternion(pq.clone().invert()).normalize();
        spin.push({ b: o, q0: o.quaternion.clone(), axis, k: reel ? 9 : 1 / Math.max(0.15, tmp.y) });
      }
    });
    // Så vendes den: filen kigger frem ad +Z, her kører maskinen frem ad +X (og spejles, så venstre er venstre)
    inst.scale.x = -1;
    const holder = new THREE.Group(); holder.rotation.y = Math.PI / 2; holder.add(inst);
    // Klippet sker, hvor klippecylindrene er: flyt modellen, så de står på det punkt, appen klipper fra
    const off = rn ? rz / rn : 0;
    holder.position.x = -off;
    holder.updateMatrixWorld(true);
    const bb = new THREE.Box3().setFromObject(holder, true);   // i maskinens egne mål (før den sættes på banen)
    G.mower.clear();
    G.mower.add(holder);
    const sh = blobShadow((bb.max.x - bb.min.x) * 1.15, (bb.max.z - bb.min.z) * 1.15);
    sh.position.x = (bb.max.x + bb.min.x) / 2; sh.position.z = (bb.max.z + bb.min.z) / 2;
    G.mower.add(sh);
    G.spin = spin; G.spinA = 0;
    G.seatX = kind === 0 ? bb.min.x - 0.6 : (bb.min.x + bb.max.x) / 2 - 0.25;
    G.seatY = kind === 0 ? 1.65 : bb.max.y - 0.25;
  };
  if (G.models[kind]) { use(G.models[kind]); return; }
  new window.GLTFLoader().load(MODEL[kind], (gl) => { G.models[kind] = gl.scene; use(gl.scene); }, undefined, () => {});
}

function build3() {
  const G = G3, m = M.map, Wm = m.W * m.cell, Hm = m.H * m.cell;
  for (const o of G.objs) G.scene.remove(o);
  G.objs = [];
  for (const k of ["baseT", "cellT", "maskT"]) if (G[k]) G[k].dispose();
  maskInit();
  G.baseT = new THREE.CanvasTexture(M.off3);
  G.baseT.colorSpace = THREE.NoColorSpace; G.baseT.magFilter = THREE.LinearFilter; G.baseT.minFilter = THREE.LinearFilter;
  G.cellT = new THREE.DataTexture(m.cells, m.W, m.H, THREE.RedFormat, THREE.UnsignedByteType);
  G.cellT.magFilter = G.cellT.minFilter = THREE.NearestFilter; G.cellT.needsUpdate = true;
  G.maskT = new THREE.CanvasTexture(M.mask);
  G.maskT.colorSpace = THREE.NoColorSpace; G.maskT.magFilter = THREE.LinearFilter; G.maskT.minFilter = THREE.LinearFilter; G.maskT.generateMipmaps = false;
  // Klippet græs: lysere og friskere end det uklippede (rough har ellers samme farve klippet og uklippet)
  const z = ZC[m.zone], rough = m.zone === 0 || m.zone === 6;
  const cutC = rough ? new THREE.Color(84 / 255, 122 / 255, 58 / 255) : new THREE.Color((z[1][0] + z[2][0]) / 510, (z[1][1] + z[2][1]) / 510, (z[1][2] + z[2][2]) / 510);
  const shared = { baseT: { value: G.baseT }, cellT: { value: G.cellT }, maskT: { value: G.maskT }, WH: { value: new THREE.Vector2(Wm, Hm) }, tz: { value: m.zone },
    fogC: { value: new THREE.Color(0xc4d6e2) } };
  const add = (o) => { G.scene.add(o); G.objs.push(o); return o; };
  // Jorden: én stor flade – banen i midten, rough udenom
  const ground = add(new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), new THREE.ShaderMaterial({
    uniforms: { ...shared, cutC: { value: cutC }, fogN: { value: 120 }, fogF: { value: 600 } }, vertexShader: GROUND_VS, fragmentShader: GROUND_FS })));
  ground.rotation.x = -Math.PI / 2; ground.position.set(Wm / 2, 0, Hm / 2);
  // Græsstrå
  const pos = [];
  for (let k = 0; k < 5; k++) {
    const a = k * 2.4, c = Math.cos(a) * 0.008, s = Math.sin(a) * 0.008, ox = Math.cos(a * 1.7) * 0.05, oz = Math.sin(a * 1.7) * 0.05;
    pos.push(ox - c, 0, oz - s, ox + c, 0, oz + s, ox * 1.6, 1, oz * 1.6);
  }
  const bg = new THREE.InstancedBufferGeometry();
  bg.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  const R = 9, sp = 0.13, n = Math.floor(2 * R / sp), io = new Float32Array(n * n * 2);
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) { io[(j * n + i) * 2] = -R + i * sp; io[(j * n + i) * 2 + 1] = -R + j * sp; }
  bg.setAttribute("io", new THREE.InstancedBufferAttribute(io, 2));
  bg.instanceCount = n * n;
  G.blades = add(new THREE.Mesh(bg, new THREE.ShaderMaterial({
    uniforms: { ...shared, camXZ: { value: new THREE.Vector2() }, R: { value: R }, time: { value: 0 } },
    vertexShader: BLADE_VS, fragmentShader: BLADE_FS, side: THREE.DoubleSide })));
  G.blades.frustumCulled = false;
  // Træer rundt om banen: nåletræer og løvtræer i forskellige grønne
  const N = 190, o3 = new THREE.Object3D();
  const coneG = new THREE.ConeGeometry(2.1, 5.5, 9); coneG.translate(0, 2.75, 0);
  const cone2 = new THREE.ConeGeometry(1.6, 4.2, 9); cone2.translate(0, 5.6, 0);
  const ballG = new THREE.IcosahedronGeometry(2.6, 1);
  const trunkG = new THREE.CylinderGeometry(0.22, 0.32, 3, 6); trunkG.translate(0, 1.5, 0);
  const leafM = new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: true });
  const conif = new THREE.InstancedMesh(coneG, leafM, N), conif2 = new THREE.InstancedMesh(cone2, leafM, N);
  const leafy = new THREE.InstancedMesh(ballG, leafM, N * 2), trunk = new THREE.InstancedMesh(trunkG, new THREE.MeshLambertMaterial({ color: 0x4a3a2a }), N * 3);
  let kc = 0, kl = 0, kt = 0, tries = 0;
  const col = new THREE.Color();
  for (let i = 0; i < N * 2 && tries++ < 8000; ) {
    const x = -80 + Math.random() * (Wm + 160), zz = -80 + Math.random() * (Hm + 160);
    if (x > -7 && x < Wm + 7 && zz > -7 && zz < Hm + 7) continue;
    i++;
    const s = 0.7 + Math.random() * 0.9, ry = Math.random() * 6;
    o3.rotation.set(0, ry, 0);
    if (Math.random() < 0.5 && kc < N) {
      o3.position.set(x, 1.4 * s, zz); o3.scale.set(s, s * (0.9 + Math.random() * 0.4), s); o3.updateMatrix();
      conif.setMatrixAt(kc, o3.matrix); conif2.setMatrixAt(kc, o3.matrix);
      col.setHSL(0.3 + Math.random() * 0.05, 0.4, 0.15 + Math.random() * 0.06); conif.setColorAt(kc, col); conif2.setColorAt(kc, col);
      kc++;
      o3.position.set(x, 0, zz); o3.scale.set(s, s * 0.6, s);
    } else {
      // Løvtræ: to-tre kugler i en klump
      const parts = 2 + (Math.random() < 0.5 ? 1 : 0);
      col.setHSL(0.22 + Math.random() * 0.08, 0.38 + Math.random() * 0.15, 0.2 + Math.random() * 0.08);
      for (let p = 0; p < parts && kl < N * 2; p++) {
        o3.position.set(x + (Math.random() - 0.5) * 2.2 * s, (4.6 + Math.random() * 1.8) * s, zz + (Math.random() - 0.5) * 2.2 * s);
        const ss = s * (0.8 + Math.random() * 0.45); o3.scale.set(ss, ss * 0.85, ss); o3.updateMatrix();
        leafy.setMatrixAt(kl, o3.matrix); leafy.setColorAt(kl, col); kl++;
      }
      o3.position.set(x, 0, zz); o3.scale.set(s, s * 1.2, s);
    }
    o3.updateMatrix(); if (kt < N * 3) trunk.setMatrixAt(kt++, o3.matrix);
  }
  conif.count = conif2.count = kc; leafy.count = kl; trunk.count = kt;
  add(conif); add(conif2); add(leafy); add(trunk);
  // Maskinen: først en reserve, så spillets egen model, når den er hentet
  G.mower = add(new THREE.Group());
  G.mowerKind = m.kind;
  G.mower.add(boxMower(m.kind, M.mw.w));
  G.spin = []; G.seatX = -0.4; G.seatY = m.kind === 0 ? 1.65 : 2.0;
  loadMower(m.kind);
  add(clipPoints());
  G.dist = m.kind === 0 ? 4.2 : 8;
  G.snap = true;
}

// ---------- Afklip: græsset flyver fra klippecylindrene og lægger sig ----------
const CLIP_N = 2400;
function clipPoints() {
  const g = new THREE.BufferGeometry();
  const P = new Float32Array(CLIP_N * 3).fill(-1000), C = new Float32Array(CLIP_N * 3);
  g.setAttribute("position", new THREE.BufferAttribute(P, 3));
  g.setAttribute("color", new THREE.BufferAttribute(C, 3));
  const pts = new THREE.Points(g, new THREE.PointsMaterial({ size: 0.06, sizeAttenuation: true, vertexColors: true }));
  pts.frustumCulled = false;
  G3.clip = { pts, P, C, V: new Float32Array(CLIP_N * 3), life: new Float32Array(CLIP_N), next: 0, acc: 0 };
  return pts;
}
function clipSpawn(nCells, dt) {
  const K = G3 && G3.clip; if (!K || !use3D()) return;
  K.acc += nCells * 1.6;
  const fx = Math.cos(M.h), fz = Math.sin(M.h), sx = -fz, sz = fx, w = M.mw.w, v = Math.max(0.3, Math.abs(M.v));
  while (K.acc >= 1) {
    K.acc -= 1;
    const i = K.next; K.next = (K.next + 1) % CLIP_N;
    const o = (Math.random() - 0.5) * w;
    K.P[i * 3] = M.x + fx * 0.15 + sx * o; K.P[i * 3 + 1] = 0.12 + Math.random() * 0.1; K.P[i * 3 + 2] = M.y + fz * 0.15 + sz * o;
    const up = 0.8 + Math.random() * 1.4, fw = v * (0.6 + Math.random() * 0.8);
    K.V[i * 3] = fx * fw + (Math.random() - 0.5) * 0.9; K.V[i * 3 + 1] = up; K.V[i * 3 + 2] = fz * fw + (Math.random() - 0.5) * 0.9;
    K.life[i] = 22 + Math.random() * 10;
    const g = 0.42 + Math.random() * 0.22;
    K.C[i * 3] = g * 0.55; K.C[i * 3 + 1] = g; K.C[i * 3 + 2] = g * 0.3;
  }
}
function clipStep(dt) {
  const K = G3 && G3.clip; if (!K) return;
  for (let i = 0; i < CLIP_N; i++) {
    if (K.life[i] <= 0) continue;
    K.life[i] -= dt;
    const y = K.P[i * 3 + 1];
    if (y > 0.015) {
      K.V[i * 3 + 1] -= 9.8 * dt;
      K.V[i * 3] *= 1 - 1.5 * dt; K.V[i * 3 + 2] *= 1 - 1.5 * dt;
      K.P[i * 3] += K.V[i * 3] * dt; K.P[i * 3 + 1] = Math.max(0.012, y + K.V[i * 3 + 1] * dt); K.P[i * 3 + 2] += K.V[i * 3 + 2] * dt;
    }
    if (K.life[i] <= 0) K.P[i * 3 + 1] = -1000;
  }
  K.pts.geometry.attributes.position.needsUpdate = true;
  K.pts.geometry.attributes.color.needsUpdate = true;
}

function draw3() {
  const G = G3, c = G.cam;
  const fx = Math.cos(M.h), fz = Math.sin(M.h);
  if (G.mower.parent !== G.scene) G.scene.add(G.mower);
  G.mower.position.set(M.x, 0, M.y);
  G.mower.quaternion.identity();
  G.mower.rotation.y = -M.h;
  // Hjul og cylindre drejer med farten
  if (G.spin && G.spin.length) {
    G.spinA += M.v * (G.dtLast || 0.016);
    const q = new THREE.Quaternion();
    for (const s of G.spin) { q.setFromAxisAngle(s.axis, -G.spinA * s.k); s.b.quaternion.copy(q).multiply(s.q0); }
  }
  // Klippesporet sendes til grafikkortet højst 12 gange i sekundet (det er et stort billede)
  const now = performance.now();
  if (M.maskDirty && now - M.maskAt > 80) { G.maskT.needsUpdate = true; M.maskDirty = false; M.maskAt = now; }
  const eye = new THREE.Vector3(), look = new THREE.Vector3();
  if (camMode === 2) {
    // Fra sædet (bag håndtaget på greensklipperen): kig frem og ned mod klippeenhederne
    const sx = G.seatX, sy = G.seatY;
    eye.set(M.x + fx * sx, sy, M.y + fz * sx);
    look.set(M.x + fx * 4.5, 0, M.y + fz * 4.5);
  } else {
    const d = G.dist, hgt = 1.3 + d * 0.4;
    eye.set(M.x - fx * d, hgt, M.y - fz * d);
    look.set(M.x + fx * 4, 0.6, M.y + fz * 4);
  }
  const a = G.snap ? 1 : 1 - Math.exp(-(camMode === 2 ? 14 : 4.5) * Math.min(0.05, G.dtLast || 0.016));
  G.eye.lerp(eye, a); G.look.lerp(look, a);
  if (G.snap) { G.eye.copy(eye); G.look.copy(look); G.snap = false; }
  c.position.copy(G.eye); c.lookAt(G.look);
  const u = G.blades.material.uniforms, lx = G.look.x - G.eye.x, lz = G.look.z - G.eye.z, ll = Math.hypot(lx, lz) || 1, ahead = Math.min(ll, 6.5);
  u.camXZ.value.set(G.eye.x + lx / ll * ahead, G.eye.z + lz / ll * ahead);
  u.time.value = now / 1000;
  clipStep(G.dtLast || 0.016);
  G.sky.position.copy(c.position);
  G.r.render(G.scene, c);
}


async function submit() {
  if (!M) return;
  const p = M.needN ? M.cutN / M.needN : 0;
  const lg = lineGrade();
  if (!confirm(`Aflever med ${Math.floor(p * 100)} % klippet?` + (lg !== null ? `\nLige striber: ${lg} %` : "") + (M.practice ? "" : `\nDu får ca. ${kr(M.job.pay * p * (M.mw.own ? 1 : 0.7))}.`))) return;
  const cutM2 = M.cutN * M.map.cell * M.map.cell;
  try {
    let r;
    if (M.practice) r = await api("practice_done", { coverage: p, cut_m2: cutM2 });
    else {
      // Sporet: "GKS1" + kortets hoved + antal + bredde + punkterne (NaN = løft)
      const pts = M.pts;
      const buf = new ArrayBuffer(44 + pts.length * 8), dv = new DataView(buf), u8 = new Uint8Array(buf);
      u8.set([71, 75, 83, 49]); u8.set(M.map.header, 4);
      dv.setUint32(36, pts.length, true); dv.setFloat32(40, M.mw.w, true);
      pts.forEach((q, k) => { dv.setFloat32(44 + k * 8, q ? q[0] : NaN, true); dv.setFloat32(48 + k * 8, q ? q[1] : NaN, true); });
      r = await api("job_submit", { id: M.job.id, strokes_b64: bytesToB64(u8), coverage: p, cut_m2: cutM2, mower: M.mw.id });
      store.set("prog_" + M.job.id, null);
    }
    M = null; mowEl.style.display = "none";
    say(r.note ? r.note : `Godt klippet! ${kr(r.earned)} er sat ind på din konto`);
    render();
  } catch (e) { say(e.message); }
}
